<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
    body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body  class="bg-gray-100 min-h-screen flex flex-col">


    <div class="flex-1 flex items-center justify-center px-4 py-10">
        <div class="bg-white rounded-xl shadow-md w-full max-w-md px-10 py-10">

           <div class="flex justify-center mb-4">
            <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-16 h-16 rounded-full"/>
           </div>

           <h1 class="text-center text-xl font-bold text-gray-900 mb-1">GitHub Issues Tracker</h1>
           <p class="text-center text-sm text-gray-500 mb-6">Sign in to manage your issues</p>

           <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input 
            id="username"
            type="text"
            placeholder="Enter Username"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            />
            <p class="text-xs text-indigo-600 mt-1">Default: admin</p>
           </div>

            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
            id="password"
            type="password"
            placeholder="Enter Password"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            />
            <p class="text-xs text-indigo-600 mt-1">Default: admin123</p>
            </div>

            <p id="error-msg" class="text-red-500 text-xs mb-3 hidden">Invalid username or password</p>

             <button
             onclick="handleLogin()"
             class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200"
             >Sign In</button>


             <div class="flex items-center my-5">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="mx-3 text-xs text-gray-400">OR</span>
                <div class="flex-1 h-px bg-gray-200"></div>
             </div>

              <div class="text-center mb-3">
                <p class="text-xs text-gray-500 mb-2">Demo Credentials:</p>

                <div class="bg-gray-100 rounded-lg py-3 px-4">
                    <p class="text-sm text-gray-700"><span class="font-semibold">Usename:</span>
                        admin</p>
                    <p class="text-sm text-gray-700"><span class="font-semibold">Password:</span> admin123</p>
                </div>
              </div>


        </div>
    </div>

    <script src="./js/auth.js"></script>
</body>
</html>
